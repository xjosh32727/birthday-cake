<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport：让手机按真实宽度渲染，否则页面会被当成电脑网页缩小，按钮点不准 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 手势状态指示灯的样式。指示灯元素由 js/gesture.js 动态创建（#gesture-status），
       四种状态靠 data-state 切换圆点颜色：
       open=绿（认出张掌） fist=金（认出握拳） none=灰（没看见手） off=红（摄像头/模型罢工） -->
  <style>
    #gesture-status {
      position: fixed;
      right: 16px;
      bottom: 150px; /* 兜底位置；gesture.js 会按预览小窗的实际位置精确贴到它正上方 */
      z-index: 51;   /* 预览小窗是 50，指示灯要高一层才不会被压住 */
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.55); /* 黑底半透明，不挡画面 */
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;            /* 胶囊形 */
      font-size: 12px;
      line-height: 1.4;
      color: #fff;
      white-space: nowrap;
      pointer-events: none;            /* 只看不摸：点击穿透，不影响下面元素的操作 */
      user-select: none;
    }
    #gesture-status .gs-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
      flex-shrink: 0;
    }
    #gesture-status[data-state="open"] .gs-dot { background: #2eff8a; box-shadow: 0 0 6px #2eff8a; }
    #gesture-status[data-state="fist"] .gs-dot { background: #ffd23f; box-shadow: 0 0 6px #ffd23f; }
    #gesture-status[data-state="none"] .gs-dot { background: #888; }
    #gesture-status[data-state="off"]  .gs-dot { background: #ff4d4d; box-shadow: 0 0 6px #ff4d4d; }
  </style>
</head>
<body>

  <!-- ==========================================================
       开场录入页：全屏覆盖层，打开网页第一眼看到的就是它。
       校验通过 + 摄像头流程走完后，它会被隐藏，露出下面的 3D 场景。
       ========================================================== -->
  <div id="intro-screen">
    <div class="card">
      <h1 class="title">Happy Birthday</h1>
      <p class="subtitle">A little celebration, made for you.</p>

      <!-- 姓名（必填） -->
      <label class="field-label" for="name-input">Name</label>
      <input id="name-input" class="neon-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off">

      <!-- 年龄（必填）。type="number" 让手机自动弹出数字键盘 -->
      <label class="field-label" for="age-input">Age</label>
      <input id="age-input" class="neon-input" type="number" placeholder="Your age" min="1" max="150" inputmode="numeric">

      <!-- 照片上传（可选）。
           原生文件选择框很丑又难改样式，所以把它"藏"起来（.visually-hidden），
           用一个好看的 label 按钮代替它：label 的 for 指向 input 的 id，
           点 label 就等价于点那个隐藏的选择框 -->
      <label class="field-label">Photos (optional)</label>
      <label class="neon-btn upload-btn" for="photo-input">Add photos</label>
      <input id="photo-input" class="visually-hidden" type="file" multiple accept="image/*">
      <!-- 已选照片的缩略图列表（预置照片 + 自己上传的照片） -->
      <div id="photo-list" class="photo-list"></div>

      <!-- 授权前的"预告"：先说清楚要摄像头干嘛，弹窗才不会吓到人 -->
      <p class="camera-note">Camera is used for hand gestures only. Nothing leaves your browser.</p>

      <button id="enter-btn" class="neon-btn enter-btn" type="button">Begin</button>

      <!-- 摄像头被拒 / 没有摄像头时的 Plan B 入口（默认隐藏） -->
      <div id="camera-denied" class="hidden">
        <p class="denied-text">No camera? No problem.</p>
        <button id="skip-camera-btn" class="neon-btn" type="button">Continue without gestures</button>
      </div>
    </div>
  </div>

  <!-- ==========================================================
       3D 蛋糕场景容器（初始隐藏）
       后续任务会把 Three.js 的画布挂进这个 div；现在它是一块全屏黑幕
       ========================================================== -->
  <div id="scene-container" class="hidden"></div>

  <!-- 右下角摄像头预览小窗（初始隐藏）。
       autoplay + playsinline + muted 是手机浏览器允许自动播放的"通行证" -->
  <video id="cam-preview" class="hidden" autoplay playsinline muted></video>

  <!-- 降级模式按钮区（初始隐藏）：没有摄像头时，用手指点按钮代替挥手 -->
  <div id="gesture-fallback" class="hidden">
    <button id="explode-toggle" class="neon-btn" type="button">✋ Open the cake</button>
  </div>

  <!-- 音乐播放器 UI 占位容器（初始隐藏）：后续任务会往这里填播放/切歌按钮 -->
  <div id="music-player" class="hidden"></div>

  <!-- ==========================================================
       第三方库 + 自己的脚本
       全部用 CDN 的"全局脚本版"（不是 ES module），
       这样双击 html（file:// 协议）和 GitHub Pages 都能直接跑。
       引入顺序固定不能乱：先三个库，再我们自己的 form.js。
       ========================================================== -->
  <!-- Three.js：3D 引擎，暴露全局变量 THREE（后续任务画蛋糕用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands：手势识别，暴露全局变量 Hands（后续任务用） -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <!-- MediaPipe Camera Utils：摄像头逐帧读取工具，暴露全局变量 Camera -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/gesture.js"></script>
  <script src="js/music.js"></script>
  <!-- 录入页逻辑（本项目自己的代码） -->
  <script src="js/form.js"></script>
</body>
</html>
